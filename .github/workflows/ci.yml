name: CI

# TEST-3 (Phase 5): CI workflow yang menjalankan:
#   - Backend (Laravel): php artisan test
#   - Frontend (Vue): vitest, type-check, build
#
# Trigger: setiap push ke main / r&d, dan setiap pull request.

on:
  push:
    branches: [main, master, r&d, develop]
  pull_request:
    branches: [main, master, r&d, develop]

# Cancel in-progress runs untuk PR yang sama saat push baru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medio-be
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: medio-be/vendor
          key: composer-${{ hashFiles('medio-be/composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment template
        run: cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Run PHP lint (syntax check)
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run tests
        run: php artisan test --parallel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medio-fe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: medio-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (warnings allowed for now)
        run: npm run lint -- --max-warnings 9999
        continue-on-error: true

      - name: Run tests
        run: npm run test:run

      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size budget
        run: npm run check:bundle-size

      - name: Upload bundle stats artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: medio-fe/stats.html
          retention-days: 14
